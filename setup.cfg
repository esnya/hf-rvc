[metadata]
name = hf_rvc
version = 0.2.1
author = esnya
description = Retrieval-based Voice Conversion (RVC) implemented with Hugging Face Transformers
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/esnya/hf_rvc
license_files = LICENSE
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3.11

[options]
packages=find:
python_requires = >=3.11
install_requires =
    torch>=2.6,<3
    pyworld
    transformers>=4.48.3,<4.49
    evaluate
    argh
    safetensors
    librosa
    praat-parselmouth

[options.extras_require]
converter = fairseq
gradio =
    gradio==6.16.0+esnya.pillow13.1
    pillow==13.0.0
    accelerate
    optimum
eval =
    datasets
    pyaudio
full =
    fairseq
    datasets
    pyaudio
    argh
