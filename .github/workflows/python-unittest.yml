name: Python offline model tests

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version:  ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          **/setup.cfg
          dependency_patches/gradio/**
    - run: |
        python -m pip install --upgrade pip
        pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
        pip install ./dependency_patches/gradio ".[gradio]"
    - run: python -m unittest tests.test_hf_rvc tests.models.test_modeling_rvc tests.test_gradio_compat
