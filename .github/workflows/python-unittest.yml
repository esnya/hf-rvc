name: Python offline model tests

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version:  ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          **/setup.cfg
          dependency_patches/gradio/**
    - run: |
        python -m pip install --upgrade pip
        TORCH_VERSION=$(python -c "import json; print(json.load(open('Pipfile.lock'))['default']['torch']['version'].removeprefix('==').split('+')[0])")
        pip install "torch==$TORCH_VERSION" --index-url https://download.pytorch.org/whl/cpu
        python -c "import json; d=json.load(open('Pipfile.lock'))['default']; print('\n'.join(n + e['version'] for n,e in d.items() if 'version' in e and n != 'torch' and n != 'triton' and not n.startswith('nvidia-')))" > /tmp/hf-rvc-constraints.txt
        pip install -c /tmp/hf-rvc-constraints.txt ./dependency_patches/gradio ".[gradio]"
        pip check
        python -c "import json; from importlib.metadata import version; d=json.load(open('Pipfile.lock'))['default']; assert version('transformers') == d['transformers']['version'].removeprefix('=='); assert version('torch').split('+')[0] == d['torch']['version'].removeprefix('==').split('+')[0]; print('Validated candidate:', version('transformers'), version('torch'))"
    - run: python -m unittest tests.test_hf_rvc tests.models.test_modeling_rvc tests.test_gradio_compat
