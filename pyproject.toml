[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hf-rvc"
version = "0.3.0"
description = "Modern Retrieval-based Voice Conversion using HuggingFace Transformers"
readme = "README.md"
license = "MIT"
authors = [{name = "esnya"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1.0",
    "pyworld>=0.3.4",
    "transformers>=4.35.0",
    "evaluate>=0.4.1",
    "argh>=0.28.0",
    "safetensors>=0.4.0",
    "librosa>=0.10.1",
    "praat-parselmouth>=0.4.3",
    "hydra-core>=1.3.0",
]

[project.optional-dependencies]
converter = ["fairseq"]
gradio = ["gradio>=4.0.0", "accelerate>=0.20.0", "optimum>=1.12.0"]
eval = ["datasets>=2.14.0", "pyaudio>=0.2.11"]
dev = [
    "ruff>=0.1.9",
    "mypy>=1.8.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.0.0",
    "pre-commit>=3.6.0",
]
full = ["hf-rvc[converter,gradio,eval]"]

[project.urls]
Homepage = "https://github.com/esnya/hf_rvc"
Repository = "https://github.com/esnya/hf_rvc"
Issues = "https://github.com/esnya/hf_rvc/issues"

[project.scripts]
hf-rvc = "hf_rvc.__main__:main"

# Ruff: フォーマッター + リンター統合
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# MyPy
[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["pyworld.*", "fairseq.*", "praat.*", "parselmouth.*"]
ignore_missing_imports = true

# Pytest
[tool.pytest.ini_options]
minversion = "7.0"
addopts = ["--cov=hf_rvc", "--cov-report=term-missing", "--cov-report=xml"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["hf_rvc"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
